services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hire}
      POSTGRES_DB: ${POSTGRES_DB:-hire}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hire}:${POSTGRES_PASSWORD:-hire}@db:5432/${POSTGRES_DB:-hire}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Необязательный HTTPS-туннель CloudPub: docker compose --profile tunnel up
  # Публичный адрес виден в логах: docker compose logs tunnel
  tunnel:
    profiles: ["tunnel"]
    image: cloudpub/cloudpub@sha256:261123b5f7706e800816af5751d42232a283a149a136718043eaeb37751fcc3b
    environment:
      TOKEN: ${CLOUDPUB_TOKEN:-}
      HTTP: api:8080
    command: ["run"]
    volumes:
      # Конфиг агента сохраняется, чтобы адрес туннеля не менялся при перезапуске
      - cloudpub-config:/home/cloudpub
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  cloudpub-config:
